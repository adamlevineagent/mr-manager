<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MR-MANAGER · Departures</title>
<style>
:root{color-scheme:dark;--amber:#ffd16b;--tile-width:clamp(6px,1.12vw,14px);--tile-height:calc(var(--tile-width)*1.8);--gap:2px;--lane:16;--status:11;--time:9;--note:30}
*{box-sizing:border-box}body{margin:0;background:#0c0d0c;color:var(--amber);font-family:Consolas,'Courier New',monospace;min-height:100vh;background-image:radial-gradient(ellipse at 50% 0,#292921 0,transparent 65%)}
main{max-width:1220px;margin:6vh auto;padding:0 30px} .frame{background:#11120f;border:1px solid #383a30;border-radius:9px;padding:28px 26px 20px;box-shadow:0 30px 70px #0009,inset 0 1px #ffffff0c;position:relative}.frame:before,.frame:after{content:'+';position:absolute;top:10px;color:#55574b;font-size:12px}.frame:before{left:11px}.frame:after{right:11px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid #55533c;padding-bottom:22px;margin-bottom:20px}.brand{font-size:11px;letter-spacing:3px;color:#a8a58d;margin-bottom:12px}.title{--tile-width:clamp(11px,1.7vw,21px)}.clock{--tile-width:clamp(13px,2vw,24px)}.clock-wrap{text-align:right}.clock-label{font-size:9px;letter-spacing:2px;color:#908e79;margin-top:10px}
.station-label{font-family:Arial,sans-serif;font-size:11px;letter-spacing:3px;color:#aaa88f;display:flex;justify-content:space-between;margin:0 0 17px}.station-label span:first-child{color:var(--amber)}
.grid{display:grid;grid-template-columns:calc(var(--lane)*(var(--tile-width) + var(--gap))) calc(var(--status)*(var(--tile-width) + var(--gap))) calc(var(--time)*(var(--tile-width) + var(--gap))) minmax(0,1fr);gap:clamp(5px,1.3vw,17px);align-items:center}.headings{font-size:10px;letter-spacing:2px;color:#8e8e77;padding:0 0 10px}.row{padding:13px 0;border-top:1px solid #2b2d25}.cell{display:flex;gap:var(--gap);white-space:nowrap;overflow:hidden;min-width:0}.flap{flex:0 0 var(--tile-width);width:var(--tile-width);height:var(--tile-height);position:relative;perspective:100px;color:inherit;font-weight:bold;font-size:calc(var(--tile-width)*1.38);line-height:var(--tile-height);border-radius:2px;background:linear-gradient(#272822 0%,#1d1e19 49%,#151612 50%,#20211a 100%);box-shadow:0 2px 2px #000b,inset 0 1px #ffffff0b;text-align:center}.flap:after{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:#050604;box-shadow:0 1px #ffffff07;z-index:4}.glyph{display:block}.leaf{position:absolute;inset:0;display:block;clip-path:inset(0 0 50% 0);background:#272822;transform-origin:center;backface-visibility:hidden;z-index:3}.flipping .leaf{animation:fold 95ms ease-in forwards}@keyframes fold{from{transform:rotateX(0deg);filter:brightness(1)}to{transform:rotateX(-95deg);filter:brightness(.35)}}
.plan{color:#b8adff}.plan .status{animation:boarding 2.7s ease-in-out infinite}.needs{color:#ffdc85}.needs .status{animation:boarding 2.7s ease-in-out infinite}@keyframes boarding{50%{filter:brightness(1.3);text-shadow:0 0 10px #ffba4266}}.auto{color:#b3d3a2}.parked{opacity:.46}.overtime .time{color:#ff865d}.disk-size{flex-shrink:0}.disk-size.large{color:#ff865d}.meta{display:flex;gap:8px;align-items:center;color:#807f6d;font-size:9px;letter-spacing:.5px;padding-top:7px;overflow:hidden;white-space:nowrap}.tag{border:1px solid #484936;border-radius:2px;padding:2px 4px;color:#bbb99c}.section{margin-top:26px}.section-title{font-family:Arial,sans-serif;color:#a6a58d;font-size:10px;letter-spacing:2.5px;margin-bottom:12px;display:flex;align-items:center;gap:10px}.section-title:after{content:'';height:1px;background:#36382c;flex:1}.arrived{opacity:.72}.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#807f6d;font-size:10px;padding-top:19px;border-top:1px solid #34362a;margin-top:24px}button{font:inherit;color:#a6a58d;background:transparent;border:1px solid #484a3b;padding:7px 9px;border-radius:3px;cursor:pointer}button:hover{color:var(--amber);border-color:var(--amber)}button:focus-visible{outline:2px solid var(--amber);outline-offset:3px}.caption{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:#777966;padding:15px 2px}.offline{color:#ff956f}
@media(min-width:1200px){:root{--lane:22}}@media(min-width:1100px){:root{--tile-width:14px}}@media(max-width:760px){:root{--lane:12;--note:18;--tile-width:clamp(6px,1.4vw,10px)}main{margin:20px auto;padding:0 12px}.frame{padding:22px 13px 16px}.brand{font-size:9px;letter-spacing:2px}.station-label{font-size:9px;letter-spacing:1px}.grid{gap:7px}.meta{font-size:8px}.caption{font-size:8px}}@media(max-width:480px){:root{--lane:9;--time:7;--note:24;--tile-width:clamp(7px,2.5vw,11px);--gap:1px}.headings{letter-spacing:1px;font-size:8px}.grid{grid-template-columns:calc(var(--lane)*(var(--tile-width) + var(--gap))) calc(var(--status)*(var(--tile-width) + var(--gap))) minmax(0,1fr)}.grid .note{grid-column:1/-1}.headings span:last-child{display:none}.row{padding:11px 0}.footer{font-size:8px}.clock-label{letter-spacing:1px}.title{--tile-width:11px}.clock{--tile-width:13px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main><div class="frame">
<header><div><div class="brand">CREW OPERATIONS / LOCAL CONTROL</div><div id="title" class="cell title" aria-label="MR-MANAGER"></div></div><div class="clock-wrap"><div id="clock" class="cell clock"></div><div class="clock-label">LOCAL TIME</div></div></header>
<div class="station-label"><span>DEPARTURES / LIVE LANES</span><span id="summary">CONNECTING</span></div>
<div class="grid headings"><span>LANE</span><span>STATUS</span><span>TIME</span><span>NOTE</span></div>
<div id="lanes"></div><div id="watched"></div>
<section class="section arrived"><div class="section-title">JUST MERGED / ARRIVALS</div><div id="merged"></div></section>
<div class="footer"><span id="connection">Waiting for the crew…</span><button id="sound" aria-pressed="false">SOUND OFF</button></div>
</div><div class="caption"><span>MR-MANAGER STATION</span><span>EVERY LANE HAS A DESTINATION</span></div></main>
<script>
'use strict';
const $=id=>document.getElementById(id), reduced=matchMedia('(prefers-reduced-motion: reduce)');
const alphabet=' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-/.:', tiles=new WeakMap();
let sound=false,audio,lastData=null,offline=false;
function clack(){if(!sound||!audio)return;const osc=audio.createOscillator(),gain=audio.createGain();osc.type='square';osc.frequency.setValueAtTime(170+Math.random()*100,audio.currentTime);gain.gain.setValueAtTime(.009,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.018);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+.02)}
$('sound').onclick=()=>{sound=!sound;if(sound){audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume()}$('sound').textContent='SOUND '+(sound?'ON':'OFF');$('sound').setAttribute('aria-pressed',String(sound))};
function tile(){const el=document.createElement('span');el.className='flap';el.setAttribute('aria-hidden','true');const glyph=document.createElement('span'),leaf=document.createElement('span');glyph.className='glyph';leaf.className='leaf';glyph.textContent=leaf.textContent=' ';el.append(glyph,leaf);tiles.set(el,{value:' ',version:0});return el}
function change(el,target,index){const state=tiles.get(el);if(state.value===target)return;state.value=target;const version=++state.version;const glyph=el.firstChild,leaf=el.lastChild;if(reduced.matches){el.classList.remove('flipping');glyph.textContent=leaf.textContent=target;return}let step=0;function flip(){if(state.version!==version||!el.isConnected)return;const next=step<3?alphabet[(alphabet.indexOf(target)+step*7+index+alphabet.length)%alphabet.length]:target;leaf.textContent=glyph.textContent;glyph.textContent=next;el.classList.remove('flipping');void el.offsetWidth;el.classList.add('flipping');clack();if(step++<3)setTimeout(flip,100);else setTimeout(()=>{if(state.version===version){el.classList.remove('flipping');leaf.textContent=target}},100)}setTimeout(flip,Math.min(index*22,600))}
function cell(el,text,width){text=String(text??'').toUpperCase();el.setAttribute('aria-label',text);el.title=text;let display=text.slice(0,width);if(el.classList.contains('lane')&&text.length>width&&!/[ -]/.test(text[width])){const boundary=Math.max(display.lastIndexOf('-'),display.lastIndexOf(' '));if(boundary>0)display=display.slice(0,boundary)}display=display.padEnd(width,' ');while(el.children.length>width)el.lastChild.remove();while(el.children.length<width)el.append(tile());Array.from(el.children).forEach((t,i)=>change(t,display[i],i))}
function widths(){const style=getComputedStyle(document.documentElement);return ['lane','status','time','note'].map(k=>parseInt(style.getPropertyValue('--'+k)))}
function minutes(n){return Math.floor(n||0)+'M'}
function rowNode(){const row=document.createElement('div');row.className='row';const grid=document.createElement('div');grid.className='grid';['lane','status','time','note'].forEach(c=>{const el=document.createElement('div');el.className='cell '+c;grid.append(el)});const meta=document.createElement('div');meta.className='meta';row.append(grid,meta);return row}
function updateRows(container,rows){const old=new Map(Array.from(container.children).map(el=>[el.dataset.key,el]));const sizes=widths();rows.forEach(r=>{const key=r.key||r.name;const el=old.get(key)||rowNode();old.delete(key);el.dataset.key=key;el.className='row '+(r.status==='PLAN REVIEW'?'plan ':r.status==='NEEDS YOU'?'needs ':r.status==='AUTO-MERGE'?'auto ':r.status==='PARKED'||r.folded?'parked ':'')+((r.flags||[]).includes('over time box')?'overtime':'');const timing=r.time??(['NEEDS YOU','PLAN REVIEW'].includes(r.status)?minutes(r.waiting_minutes)+' WAIT':r.watched?(r.elapsed_minutes==null?'--':minutes(r.elapsed_minutes)):r.status==='PARKED'?'':minutes(r.elapsed_minutes)+'/'+(r.timebox||'-'));const note=r.note||'';[r.name,r.status,timing,note].forEach((v,i)=>cell(el.firstChild.children[i],v,sizes[i]));const meta=el.lastChild;meta.replaceChildren();if(r.disk_bytes!=null){const disk=document.createElement('span');disk.className='disk-size'+(r.disk_bytes>=5000000000?' large':'');disk.textContent=(r.disk_bytes/1000000000).toFixed(1)+' GB';meta.append(disk)}const tags=[];if(r.source)tags.push(r.source);if(r.repo)tags.push(r.repo);if(r.adopted)tags.push('ADOPTED');if(r.report_kind)tags.push(r.report_kind);if(r.auto)tags.push('AUTO');tags.forEach(t=>{const tag=document.createElement('span');tag.className='tag';tag.textContent=t;meta.append(tag)});const detail=document.createElement('span');detail.textContent=[r.account?'ACCOUNT '+r.account:'',r.commits!=null?r.commits+' COMMITS / '+r.lines+' LINES':'',...(r.flags||[])].filter(Boolean).join(' · ');meta.append(detail);if(!meta.textContent)meta.style.display='none';else meta.style.display='flex';container.append(el)});old.forEach(el=>el.remove())}
function watchedDisplayRows(rows){
  const longIdle=r=>r.status==='IDLE'&&(r.elapsed_minutes==null||r.elapsed_minutes>120);
  const idle=rows.filter(longIdle),visible=rows.filter(r=>!longIdle(r));
  visible.sort((a,b)=>{
    const rank=r=>r.status==='WORKING'?0:r.status==='IDLE'?1:2;
    return rank(a)-rank(b)||(a.elapsed_minutes==null)-(b.elapsed_minutes==null)||
      (a.status==='WORKING'?b.elapsed_minutes-a.elapsed_minutes:a.elapsed_minutes-b.elapsed_minutes)||a.name.localeCompare(b.name);
  });
  if(idle.length)visible.push({key:'folded-idle:'+rows[0].source,name:'IDLE ('+idle.length+')',status:'IDLE',time:'',folded:true,watched:true,source:rows[0].source,
    disk_bytes:idle.some(r=>r.disk_bytes!=null)?idle.reduce((sum,r)=>sum+(r.disk_bytes||0),0):null,note:idle.map(r=>r.name).join(', ')});
  return visible;
}
function render(data){lastData=data;const parked=data.lanes.filter(r=>r.status==='PARKED'),active=data.lanes.filter(r=>r.status!=='PARKED');if(parked.length)active.push({name:'PARKED ('+parked.length+')',status:'PARKED',disk_bytes:parked.some(r=>r.disk_bytes!=null)?parked.reduce((sum,r)=>sum+(r.disk_bytes||0),0):null,note:parked.map(r=>r.name).join(', ')});updateRows($('lanes'),active.length?active:(data.watched||[]).length?[]:[{name:'NO LANES',status:'',time:'',note:'mrm assign'}]);const sources=new Map();(data.watched||[]).forEach(r=>{if(!sources.has(r.source))sources.set(r.source,[]);sources.get(r.source).push(r)});const old=new Map(Array.from($('watched').children).map(el=>[el.dataset.source,el]));sources.forEach((rows,label)=>{let section=old.get(label);old.delete(label);if(!section){section=document.createElement('section');section.className='section';section.dataset.source=label;const heading=document.createElement('div');heading.className='section-title';heading.textContent=label.toUpperCase()+' / READ ONLY';const body=document.createElement('div');section.append(heading,body)}updateRows(section.lastChild,watchedDisplayRows(rows));$('watched').append(section)});old.forEach(el=>el.remove());updateRows($('merged'),data.merged.length?data.merged.map(r=>({key:r.name+':'+r.closed,name:r.name,status:r.auto_merged?'AUTO-MERGE':'CLOSED',time:minutes((data.now-r.closed)/60)+' AGO',note:r.result,flags:[]})):[{name:'—',status:'',time:'',note:'No arrivals in the last 24 hours'}]);$('summary').textContent=(data.lanes.length+(data.watched||[]).length)+' LANES · '+[...data.lanes,...(data.watched||[])].filter(r=>r.status==='WORKING').length+' WORKING \u00b7 '+data.lanes.filter(r=>['NEEDS YOU','PLAN REVIEW'].includes(r.status)).length+' NEED YOU'+(data.disk_bytes!=null?' · '+(data.disk_bytes/1000000000).toFixed(0)+' GB':'');$('connection').textContent='LIVE · EVERY 3S'+(data.disk_bytes!=null?' · LANES '+(data.disk_bytes/1000000000).toFixed(1)+' GB':'');}
function title(){cell($('title'),offline?'BOARD OFFLINE':'MR-MANAGER',13);$('title').classList.toggle('offline',offline)}
function clock(){cell($('clock'),new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false}),5)}
async function poll(){try{const response=await fetch('/board.json',{cache:'no-store',signal:AbortSignal.timeout(2500)});if(!response.ok)throw Error(response.status);const data=await response.json();offline=false;title();render(data)}catch(e){offline=true;title();$('connection').textContent='OFFLINE · LAST BOARD RETAINED · RETRYING'}finally{setTimeout(poll,3000)}}
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(lastData)render(lastData)},150)});title();clock();setInterval(clock,1000);poll();
</script>
</body></html>
